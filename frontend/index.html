<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF7900'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QuickBite | Khaao Pio Moj Karo</title>
    <!-- Fonts: Inter & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Early Error Catcher to prevent any black/blank screen
      window.addEventListener('error', function(e) {
        console.error('QuickBite Early Error:', e);
        var errEl = document.getElementById('qb-early-error');
        if (errEl) {
          errEl.style.display = 'block';
          errEl.innerText = 'Initialization Note: ' + (e.message || 'Loading module...');
        }
      });
    </script>
  </head>
  <body style="margin: 0; background-color: #0F0F0F; color: #FFFFFF;">
    <div id="root">
      <!-- Instant Visual Loader while React Bundles Mount -->
      <div id="qb-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0F0F0F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; box-sizing: border-box;">
        <div style="width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #FF7200, #FF5500); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(255, 114, 0, 0.4);">
          <span style="font-size: 32px;">🔥</span>
        </div>
        <h2 style="font-size: 24px; font-weight: 800; margin: 0 0 6px 0; color: #FFFFFF; letter-spacing: -0.5px;">QuickBite</h2>
        <p style="font-size: 12px; color: #FF7200; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 24px 0;">Khaao Pio Moj Karo</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #FF7200; border-radius: 50%; animation: qb-spin 0.8s linear infinite;"></div>
        <div id="qb-early-error" style="display: none; margin-top: 20px; color: #EF4444; font-size: 12px; max-width: 340px; text-align: center;"></div>
        <style>
          @keyframes qb-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
